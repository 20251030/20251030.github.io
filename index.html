<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>小草国</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-yozai-medium/font.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Yozai Medium", sans-serif;
            background: linear-gradient(to bottom, #a8edea, #fed6e3, #96e6a1);
            background-attachment: fixed;
            min-height: 100vh;
            transition: background 0.5s ease;
        }

        /* 第二套内容的背景：日落橙粉 */
        body.theme-b {
            background: linear-gradient(to bottom, #ff9a9e, #fecfef, #f6d365);
        }

        /* 封面页 */
        #cover {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        #cover h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
        }
        #cover button {
            padding: 15px 40px;
            font-size: 18px;
            background: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-family: "Yozai Medium", sans-serif;
        }

        /* 内容区 */
        #content {
            display: none;
            padding: 20px;
            text-align: center;
        }

        /* 毛玻璃文字框 */
        .text-box {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
            color: #333;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        /* 第二套内容里，文字框样式（亮色背景配深色字） */
        body.theme-b .text-box {
            color: #333;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* 滚动淡入 */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease, transform 1s ease;
        }
        .fade-in.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 烟花画布 */
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

<!-- 烟花画布 -->
<canvas id="fireworks"></canvas>

<!-- 封面页 -->
<div id="cover">
    <h1>欢迎来到我的相册</h1>
    <button onclick="enterSite()">点击进入</button>
</div>

<!-- 内容区 -->
<div id="content">
    <script>
        // 两个密码，两套内容
        var passwordA = "20251030";
        var passwordB = "314159";

        var userInput = prompt("请输入通关密钥：");

        if (userInput === passwordA) {
            document.write(`
                <div class="text-box fade-in">
                    <h1>小草国建国一周年庆典</h1>
                    <p>这是密码 A 才能看到的内容。</p>
                </div>
                <div class="text-box fade-in">
                    <p>这里可以放第一套的照片。</p>
                </div>
            `);
        } else if (userInput === passwordB) {
            document.body.classList.add('theme-b');
            document.write(`
                <div class="text-box fade-in">
                    <h1>Europa和Iris的日常碎片/h1>
                    <p>这是密码 B 才能看到的内容。</p>
                </div>
                <div class="text-box fade-in">
                    <p>这里可以放第二套的照片。</p>
                </div>
            `);
        } else {
            document.write("<p>密码错误，刷新页面重试。</p>");
        }

        function enterSite() {
            document.getElementById('cover').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            checkFade();

            setTimeout(function() {
                createFirework(window.innerWidth * 0.3, window.innerHeight * 0.4);
                createFirework(window.innerWidth * 0.7, window.innerHeight * 0.5);
                createFirework(window.innerWidth * 0.5, window.innerHeight * 0.3);
            }, 300);
        }

        function checkFade() {
            var elements = document.querySelectorAll('.fade-in');
            for (var i = 0; i < elements.length; i++) {
                var rect = elements[i].getBoundingClientRect();
                if (rect.top < window.innerHeight - 50) {
                    elements[i].classList.add('show');
                }
            }
        }
        window.addEventListener('scroll', checkFade);
        window.addEventListener('load', checkFade);

        // ===== 烟花效果 =====
        var canvas = document.getElementById('fireworks');
        var ctx = canvas.getContext('2d');
        var particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function createFirework(x, y) {
            var colors = ['#ff9a9e', '#a1c4fd', '#d4fc79', '#fed6e3', '#96e6a1', '#fff'];
            for (var i = 0; i < 150; i++) {
                var angle = Math.random() * Math.PI * 2;
                var speed = Math.random() * 8 + 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = particles.length - 1; i >= 0; i--) {
                var p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.life -= 0.015;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        document.addEventListener('click', function(e) {
            createFirework(e.clientX, e.clientY);
        });
    </script>
</div>

</body>
</html>
