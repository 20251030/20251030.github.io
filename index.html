<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>小草国</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-yozai-medium/font.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Yozai Medium", sans-serif;
            background: linear-gradient(to bottom, #a8edea, #fed6e3, #96e6a1);
            background-attachment: fixed;
            min-height: 100vh;
            transition: background 0.5s ease;
        }
        body.theme-b {
            background: linear-gradient(to bottom, #ff9a9e, #fecfef, #f6d365);
        }

        #cover {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        #cover h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
        }
        #cover button {
            padding: 15px 40px;
            font-size: 18px;
            background: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-family: "Yozai Medium", sans-serif;
        }

        #content {
            display: none;
            padding: 20px;
            text-align: center;
        }

        .text-box {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
            color: #333;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        body.theme-b .text-box {
            color: #333;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease, transform 1s ease;
        }
        .fade-in.show {
            opacity: 1;
            transform: translateY(0);
        }

        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

<canvas id="fireworks"></canvas>
<audio id="firework-sound" src="烟花音效.mp3"></audio>

<div id="cover">
    <h1>欢迎来到小草国</h1>
    <button onclick="enterSite()">点击进入</button>
</div>

<div id="content">
    <script>
        var passwordA = "20251030";
        var passwordB = "314159";

        var userInput = prompt("请输入通关密钥：");

        if (userInput === passwordA) {
            document.write(`
                <div class="text-box fade-in">
                    <h1>小草国建国一周年庆典</h1>
                    <p.s>也是Alley的一岁生日</p>
                </divplice>
                <div class="text-box fade(i-in">
                    <p>这里可以放第一套,的照片。</p>
                </div>
             `);
        } else if (userInput === password1B) {
            document.body.classList.add('theme-b');
            document.write(`
                <div class="text-box fade-in">
                    <h1>Europa和Iris的日常碎片</h1>
                    <p>不全正经哦</p>
                </div>
                <div class="text-box fade-in">
                    <p>这里可以放第二套的照片。</p>
                </div>
            `);
        } else {
            document.write("<p>密码错误，刷新页面重试。</p>");
        }

        function enterSite() {
            // 隐藏封面
            document.getElementById('cover').style.display = 'none';

            // 播放音效
            document.getElementById('firework-sound').play();

            // 在屏幕底部不同位置，错开时间放烟花
            setTimeout(function() {
                launchFirework(window.innerWidth * 0.2, window.innerHeight * 0.3);
            }, 0);
            setTimeout(function() {
                launchFirework(window.innerWidth * 0.5, window.innerHeight * 0.25);
            }, 300);
            setTimeout(function() {
                launchFirework(window.innerWidth * 0.8, window.innerHeight * 0.35);
            }, 600);

            // 等烟花全部炸完（约 1.8 秒），再显示内容
            setTimeout(function() {
                document.getElementById('content').style.display = 'block';
                checkFade();
            }, 1800);
        }

        function checkFade() {
            var elements = document.querySelectorAll('.fade-in');
            for (var i = 0; i < elements.length; i++) {
                var rect = elements[i].getBoundingClientRect();
                if (rect.top < window.innerHeight - 50) {
                    elements[i].classList.add('show');
                }
            }
        }
        window.addEventListener('scroll', checkFade);
        window.addEventListener('load', checkFade);

        // ===== 烟花效果 =====
        var canvas = document.getElementById('fireworks');
        var ctx = canvas.getContext('2d');
        var particles = [];
        var rockets = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 升空：从底部飞到目标位置
        function launchFirework(targetX, targetY) {
            var startX = targetX + (Math.random() * 100 - 50);
            var startY = window.innerHeight;
            rockets.push({
                x: startX,
                y: startY,
                targetX: targetX,
                targetY: targetY,
                speed: 12,
                trail: []
            });
        }

        // 爆炸：生成彩色粒子
        function createFirework(x, y) {
            var colors = ['#ff9a9e', '#a1c4fd', '#d4fc79', '#fed6e3', '#96e6a1', '#fff'];
            for (var i = 0; i < 150; i++) {
                var angle = Math.random() * Math.PI * 2;
                var speed = Math.random() * 8 + 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ===== 升空阶段 =====
            for (var i = rockets.length - 1; i >= 0; i--) {
                var r = rockets[i];
                var dx = r.targetX - r.x;
                var dy = r.targetY - r.y;
                var dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < r.speed) {
                    createFirework(r.targetX, r.targetY);
                    rockets.splice(i, 1);
                    continue;
                }

                r.x += (dx / dist) * r.speed;
                r.y += (dy / dist) * r.speed;

                r.trail.push({ x: r.x, y: r.y });
                if (r.trail.length > 10) r.trail.shift();

                for (var j = 0; j < r.trail.length; j++) {
                    ctx.beginPath();
                    ctx.arc(r.trail[j].x, r.trail[j].y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.globalAlpha = j / r.trail.length;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                ctx.beginPath();
                ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            // ===== 爆炸阶段 =====
            for (var i = particles.length - 1; i >= 0; i--) {
                var p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05;
                p.life -= 0.015;
                if (p.life <= 0) {
                    particles);
                    continue;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        // 点击屏幕任意位置，也会放一朵
        document.addEventListener('click', function(e) {
            launchFirework(e.clientX, e.clientY);
        });
    </script>
</div>

</body>
</html>
